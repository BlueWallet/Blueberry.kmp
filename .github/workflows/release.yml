name: Release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Resolve release version
        run: bash scripts/release-version.sh "${{ github.ref_name }}" "$(date -u +%H)" >> "$GITHUB_ENV"

      - name: Bundle release APK
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon -PversionCode="${{ env.VERSION_CODE }}" -PversionName="${{ env.VERSION_NAME }}"

      - name: Sign release APK
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/blueberry-upload.jks"
          shopt -s nullglob
          apks=()
          for f in androidApp/build/outputs/apk/release/*.apk; do
            apks+=("$f")
          done
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "expected one release apk, found ${#apks[@]}" >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner not found under ${sdk_root}/build-tools" >&2
            exit 1
          fi
          mkdir -p dist
          signed="dist/blueberry-${FILE_DATE}-android.apk"
          "$apksigner" sign \
            --ks "${RUNNER_TEMP}/blueberry-upload.jks" \
            --ks-key-alias blueberry-upload \
            --ks-pass "pass:${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" \
            --out "$signed" \
            "${apks[0]}"
          "$apksigner" verify "$signed"
          rm -f "${RUNNER_TEMP}/blueberry-upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/blueberry-${{ env.FILE_DATE }}-android.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            gradle: :desktopApp:packageDeb :desktopApp:createDistributable
            installer-glob: desktopApp/build/compose/binaries/main/deb/*.deb
            installer-suffix: linux-x64.deb
            zip-suffix: linux-x64.zip
          - name: macos-arm64
            os: macos-latest
            gradle: :desktopApp:packageDmg :desktopApp:createDistributable
            installer-glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            installer-suffix: macos-arm64.dmg
            zip-suffix: macos-arm64.zip
          - name: macos-x64
            os: macos-15-intel
            gradle: :desktopApp:packageDmg :desktopApp:createDistributable
            installer-glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            installer-suffix: macos-x64.dmg
            zip-suffix: macos-x64.zip
          - name: windows
            os: windows-latest
            gradle: :desktopApp:packageMsi :desktopApp:createDistributable
            installer-glob: desktopApp/build/compose/binaries/main/msi/*.msi
            installer-suffix: windows-x64.msi
            zip-suffix: windows-x64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot zip

      - name: Add WiX to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          )
          $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw "WiX bin not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "Using WiX at $wixBin"

      - name: Resolve release version
        shell: bash
        run: bash scripts/release-version.sh "${{ github.ref_name }}" "$(date -u +%H)" >> "$GITHUB_ENV"

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew ${{ matrix.gradle }} --no-daemon -PpackageVersion="${{ env.PACKAGE_VERSION }}"

      - name: Stage installer and app zip
        shell: bash
        env:
          INSTALLER_GLOB: ${{ matrix.installer-glob }}
          INSTALLER_SUFFIX: ${{ matrix.installer-suffix }}
          ZIP_SUFFIX: ${{ matrix.zip-suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=()
          for f in $INSTALLER_GLOB; do
            if [[ -f "$f" ]]; then
              installers+=("$f")
            fi
          done
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "expected one installer (${INSTALLER_GLOB}), found ${#installers[@]}" >&2
            exit 1
          fi
          app_dir="desktopApp/build/compose/binaries/main/app"
          if [[ ! -d "$app_dir" ]] || [[ -z "$(ls -A "$app_dir")" ]]; then
            echo "missing distributable under ${app_dir}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${installers[0]}" "dist/blueberry-${FILE_DATE}-${INSTALLER_SUFFIX}"
          archive="$(pwd)/dist/blueberry-${FILE_DATE}-${ZIP_SUFFIX}"
          case "${RUNNER_OS}" in
            Linux|macOS)
              (cd "$app_dir" && zip -qry -y "$archive" .)
              ;;
            Windows)
              # Git Bash tar is GNU tar. `tar -a -cf file.zip` writes a tar
              # archive and exits 0. Windows bsdtar writes a real zip.
              win_tar="$(cygpath -u "${SYSTEMROOT}")/System32/tar.exe"
              "$win_tar" -a -cf "$archive" -C "$app_dir" .
              ;;
            *)
              echo "unsupported RUNNER_OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          magic="$(od -An -t x1 -N 4 "$archive" | tr -d ' \n')"
          if [[ "$magic" != "504b0304" ]]; then
            echo "app archive is not a zip (magic ${magic})" >&2
            exit 1
          fi

      # Artifact names: release-linux, release-macos-arm64, release-macos-x64, release-windows
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/blueberry-${{ env.FILE_DATE }}-${{ matrix.installer-suffix }}
            dist/blueberry-${{ env.FILE_DATE }}-${{ matrix.zip-suffix }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve release version
        run: bash scripts/release-version.sh "${{ github.ref_name }}" "$(date -u +%H)" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/blueberry-${{ env.FILE_DATE }}-android.apk
            dist/blueberry-${{ env.FILE_DATE }}-linux-x64.deb
            dist/blueberry-${{ env.FILE_DATE }}-linux-x64.zip
            dist/blueberry-${{ env.FILE_DATE }}-macos-arm64.dmg
            dist/blueberry-${{ env.FILE_DATE }}-macos-arm64.zip
            dist/blueberry-${{ env.FILE_DATE }}-macos-x64.dmg
            dist/blueberry-${{ env.FILE_DATE }}-macos-x64.zip
            dist/blueberry-${{ env.FILE_DATE }}-windows-x64.msi
            dist/blueberry-${{ env.FILE_DATE }}-windows-x64.zip
