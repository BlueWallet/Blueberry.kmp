name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.out.outputs.tag_name }}
      version_name: ${{ steps.out.outputs.version_name }}
      version_code: ${{ steps.out.outputs.version_code }}
      package_version: ${{ steps.out.outputs.package_version }}
      file_date: ${{ steps.out.outputs.file_date }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
              echo "releases come from master" >&2
              exit 1
            fi
            tag="v$(date -u +%Y.%m.%d)"
            http_code="$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}")"
            if [[ "$http_code" == "200" ]]; then
              echo "tag ${tag} already exists" >&2
              exit 1
            fi
            if [[ "$http_code" != "404" ]]; then
              echo "could not check tag ${tag} (HTTP ${http_code})" >&2
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
          fi
          name="${tag#v}"
          IFS=. read -r year month day <<< "$name"
          hour="$(date -u +%H)"
          # Windows packageVersion parts must be 0-255, so the year drops 2000.
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "version_name=${year}.${month}.${day}" >> "$GITHUB_OUTPUT"
          echo "version_code=${year}${month}${day}${hour}" >> "$GITHUB_OUTPUT"
          echo "package_version=$((10#$year - 2000)).$((10#$month)).$((10#$day))" >> "$GITHUB_OUTPUT"
          echo "file_date=${year}-${month}-${day}" >> "$GITHUB_OUTPUT"

  android:
    name: android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      FILE_DATE: ${{ needs.version.outputs.file_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Bundle release APK
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew :androidApp:assembleRelease --no-daemon -PversionCode="${{ env.VERSION_CODE }}" -PversionName="${{ env.VERSION_NAME }}"

      - name: Sign release APK
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/blueberry-upload.jks"
          shopt -s nullglob
          apks=()
          for f in androidApp/build/outputs/apk/release/*.apk; do
            apks+=("$f")
          done
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "expected one release apk, found ${#apks[@]}" >&2
            exit 1
          fi
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner not found under ${sdk_root}/build-tools" >&2
            exit 1
          fi
          mkdir -p dist
          signed="dist/blueberry-${FILE_DATE}-android.apk"
          "$apksigner" sign \
            --ks "${RUNNER_TEMP}/blueberry-upload.jks" \
            --ks-key-alias blueberry-upload \
            --ks-pass "pass:${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_UPLOAD_KEYSTORE_PASSWORD}" \
            --out "$signed" \
            "${apks[0]}"
          "$apksigner" verify "$signed"
          rm -f "${RUNNER_TEMP}/blueberry-upload.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/blueberry-${{ env.FILE_DATE }}-android.apk
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: desktop-${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      FILE_DATE: ${{ needs.version.outputs.file_date }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            gradle: :desktopApp:packageDeb
            installer-glob: desktopApp/build/compose/binaries/main/deb/*.deb
            installer-suffix: linux-x64.deb
          - name: macos-arm64
            os: macos-latest
            gradle: :desktopApp:packageDmg
            installer-glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            installer-suffix: macos-arm64.dmg
          - name: macos-x64
            os: macos-15-intel
            gradle: :desktopApp:packageDmg
            installer-glob: desktopApp/build/compose/binaries/main/dmg/*.dmg
            installer-suffix: macos-x64.dmg
          - name: windows
            os: windows-latest
            gradle: :desktopApp:packageMsi
            installer-glob: desktopApp/build/compose/binaries/main/msi/*.msi
            installer-suffix: windows-x64.msi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Add WiX to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          )
          $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw "WiX bin not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "Using WiX at $wixBin"

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew ${{ matrix.gradle }} --no-daemon -PpackageVersion="${{ env.PACKAGE_VERSION }}" -PversionName="${{ env.VERSION_NAME }}"

      - name: Stage installer
        shell: bash
        env:
          INSTALLER_GLOB: ${{ matrix.installer-glob }}
          INSTALLER_SUFFIX: ${{ matrix.installer-suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=()
          for f in $INSTALLER_GLOB; do
            if [[ -f "$f" ]]; then
              installers+=("$f")
            fi
          done
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "expected one installer (${INSTALLER_GLOB}), found ${#installers[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${installers[0]}" "dist/blueberry-${FILE_DATE}-${INSTALLER_SUFFIX}"

      # Artifact names: release-linux, release-macos-arm64, release-macos-x64, release-windows
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/blueberry-${{ env.FILE_DATE }}-${{ matrix.installer-suffix }}
          if-no-files-found: error
          retention-days: 14

  # Same archive and export as testflight.yml. This job does not upload to TestFlight.
  ios:
    name: ios
    needs: version
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      VERSION_CODE: ${{ needs.version.outputs.version_code }}
      FILE_DATE: ${{ needs.version.outputs.file_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Import signing certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/blueberry.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 --decode > "${RUNNER_TEMP}/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "${RUNNER_TEMP}/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "${RUNNER_TEMP}/dist.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APPSTORE_PROFILE" | base64 --decode > "${RUNNER_TEMP}/profile.mobileprovision"
          UUID="$(security cms -D -i "${RUNNER_TEMP}/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "${RUNNER_TEMP}/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile $UUID"
          rm -f "${RUNNER_TEMP}/profile.mobileprovision"

      - name: Archive iOS app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/Blueberry.xcarchive \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
            PRODUCT_BUNDLE_IDENTIFIER=io.bluewallet.blueberry \
            DEVELOPMENT_TEAM=A7W54YZ4WU \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Blueberry App Store" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath iosApp/build/Blueberry.xcarchive \
            -exportPath iosApp/build/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Stage IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=()
          for f in iosApp/build/export/*.ipa; do
            ipas+=("$f")
          done
          if [[ ${#ipas[@]} -ne 1 ]]; then
            echo "expected one ipa, found ${#ipas[@]}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "${ipas[0]}" "dist/blueberry-${FILE_DATE}-ios.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: dist/blueberry-${{ env.FILE_DATE }}-ios.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: [version, android, desktop, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FILE_DATE: ${{ needs.version.outputs.file_date }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/blueberry-${{ env.FILE_DATE }}-android.apk
            dist/blueberry-${{ env.FILE_DATE }}-linux-x64.deb
            dist/blueberry-${{ env.FILE_DATE }}-macos-arm64.dmg
            dist/blueberry-${{ env.FILE_DATE }}-macos-x64.dmg
            dist/blueberry-${{ env.FILE_DATE }}-windows-x64.msi
            dist/blueberry-${{ env.FILE_DATE }}-ios.ipa
