name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Assemble debug APK
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          archive: false

  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            gradle: :desktopApp:packageDeb
            artifact-name: desktop-linux
            artifact-path: desktopApp/build/compose/binaries/main/deb/*.deb
          - name: macos
            os: macos-latest
            gradle: :desktopApp:packageDmg
            artifact-name: desktop-macos
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - name: windows
            os: windows-latest
            gradle: :desktopApp:packageMsi
            artifact-name: desktop-windows
            artifact-path: desktopApp/build/compose/binaries/main/msi/*.msi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Add WiX to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          )
          $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw "WiX bin not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "Using WiX at $wixBin"

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew ${{ matrix.gradle }} --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

  ios:
    name: ios-simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Build iOS simulator app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Check simulator app
        run: test -d iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/Blueberry.app

      # Tarred so the app keeps its executable bits; the e2e-ios-simulator job below reuses it.
      - name: Package simulator app
        run: tar -czf Blueberry-ios-simulator.tar.gz -C iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator Blueberry.app

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: Blueberry-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14

  e2e-ios-simulator:
    name: e2e-ios-simulator
    needs: ios
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: ios-simulator

      - name: Unpack simulator app
        run: |
          mkdir -p app
          tar -xzf Blueberry-ios-simulator.tar.gz -C app
          test -x app/Blueberry.app/Blueberry

      - name: Install Maestro (pinned, checksum verified)
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      # Runs every flow in iosApp/maestro/flows (see iosApp/maestro/README.md). Test Tor flows use the
      # live Tor network, no mocks.
      - name: Run Maestro flows on an iPhone simulator
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
        run: |
          # 35-minute cap per attempt; 120-minute job limit fits three plus setup.
          ATTEMPT_TIMEOUT=2100
          JOB_SUMMARY="${GITHUB_STEP_SUMMARY:-}"

          # macOS-safe timeout: no GNU timeout. On expiry, TERM the tree, remember
          # process groups, then KILL that set plus any new groups (exit 124).
          run_with_timeout() {
            local seconds=$1
            shift
            perl -e '
              my $timeout = shift @ARGV;
              my $pid = fork();
              die "fork: $!" unless defined $pid;
              if ($pid == 0) {
                setpgrp(0, 0);
                exec @ARGV;
                exit 127;
              }
              sub pids_under {
                my ($root) = @_;
                my %ppid;
                open my $fh, "-|", "ps", "-axo", "pid=,ppid=" or return ();
                while (<$fh>) {
                  my ($p, $pp) = /^\s*(\d+)\s+(\d+)\s*$/;
                  $ppid{$p} = $pp if defined $p;
                }
                close $fh;
                my %want = ($root => 1);
                my $again = 1;
                while ($again) {
                  $again = 0;
                  for my $p (keys %ppid) {
                    next if $want{$p};
                    if ($want{$ppid{$p}}) { $want{$p} = 1; $again = 1; }
                  }
                }
                return grep { $_ != $root } keys %want;
              }
              sub collect_groups {
                my ($root) = @_;
                my @desc = pids_under($root);
                my %pg = ($root => 1);
                for my $p ($root, @desc) {
                  my $g = `ps -o pgid= -p $p 2>/dev/null`;
                  $g =~ s/\s+//g;
                  $pg{$g} = 1 if $g =~ /^\d+$/;
                }
                return (\%pg, [$root, @desc]);
              }
              sub kill_groups {
                my ($sig, $pg, $pids) = @_;
                kill $sig, map { -$_ } keys %$pg;
                kill $sig, @$pids;
              }
              $SIG{ALRM} = sub {
                my ($pg, $pids) = collect_groups($pid);
                kill_groups("TERM", $pg, $pids);
                sleep 2;
                my ($pg2, $pids2) = collect_groups($pid);
                $pg->{$_} = 1 for keys %$pg2;
                kill_groups("KILL", $pg, $pids2);
                kill "KILL", @$pids;
                waitpid($pid, 0);
                exit 124;
              };
              alarm $timeout;
              waitpid($pid, 0);
              my $status = $?;
              alarm 0;
              exit($status == -1 ? 1 : ($status & 127) ? 1 : ($status >> 8));
            ' "$seconds" "$@"
          }

          # Same preference as run-e2e.sh: a plain "iPhone N" on the newest iOS runtime.
          pick_type_and_runtime() {
            local types runtimes devices pick_status
            types="$(mktemp)"
            runtimes="$(mktemp)"
            devices="$(mktemp)"
            if run_with_timeout 10 xcrun simctl list devices available -j > "$devices" &&
              python3 - "$devices" <<'PICK'
          import json, re, sys
          data = json.load(open(sys.argv[1])).get("devices", {})
          best = None
          for runtime, devices in data.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for d in devices:
                  name = d.get("name", "")
                  dtype = d.get("deviceTypeIdentifier")
                  if not dtype or not name.startswith("iPhone"):
                      continue
                  plain = re.fullmatch(r"iPhone (\d+)", name)
                  key = (plain is not None, version, int(plain.group(1)) if plain else 0)
                  if best is None or key > best[0]:
                      best = (key, dtype, runtime, name)
          if not best:
              sys.exit(1)
          print(best[1])
          print(best[2])
          print(f"{best[3]} / {best[2]}", file=sys.stderr)
          PICK
            then
              pick_status=0
            elif run_with_timeout 10 xcrun simctl list devicetypes -j > "$types" &&
              run_with_timeout 10 xcrun simctl list runtimes -j > "$runtimes" &&
              python3 - "$types" "$runtimes" <<'PICK'
          import json, re, sys
          types = json.load(open(sys.argv[1])).get("devicetypes", [])
          runtimes = json.load(open(sys.argv[2])).get("runtimes", [])
          best_rt = None
          for rt in runtimes:
              if not rt.get("isAvailable", True):
                  continue
              ident = rt.get("identifier", "")
              m = re.search(r"iOS-(\d+)-(\d+)", ident)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              if best_rt is None or ver > best_rt[0]:
                  best_rt = (ver, ident)
          best_dt = None
          for dt in types:
              plain = re.fullmatch(r"iPhone (\d+)", dt.get("name", ""))
              if not plain:
                  continue
              n = int(plain.group(1))
              if best_dt is None or n > best_dt[0]:
                  best_dt = (n, dt["identifier"], dt["name"])
          if not best_rt or not best_dt:
              sys.exit(1)
          print(best_dt[1])
          print(best_rt[1])
          print(f"{best_dt[2]} / {best_rt[1]}", file=sys.stderr)
          PICK
            then
              pick_status=0
            else
              pick_status=1
            fi
            rm -f "$types" "$runtimes" "$devices"
            return "$pick_status"
          }

          delete_sim() {
            local udid="$1"
            [ -n "$udid" ] || return 0
            run_with_timeout 30 xcrun simctl shutdown "$udid" || true
            run_with_timeout 30 xcrun simctl delete "$udid" || true
          }

          publish_summary() {
            [ -n "$JOB_SUMMARY" ] || return 0
            {
              echo "### E2E iOS simulator"
              echo ""
              echo "attempt $(cat e2e-ios-out/attempt 2>/dev/null || echo "?"), status $(cat e2e-ios-out/status 2>/dev/null || echo "?"), $(cat e2e-ios-out/reason 2>/dev/null || echo "no summary")"
              echo ""
            } >> "$JOB_SUMMARY"
            if [ -f e2e-ios-out/summary.md ]; then
              cat e2e-ios-out/summary.md >> "$JOB_SUMMARY"
            fi
          }

          DEVTYPE=""
          RUNTIME=""
          pick="$(mktemp)"
          if pick_type_and_runtime > "$pick"; then
            DEVTYPE="$(sed -n '1p' "$pick")"
            RUNTIME="$(sed -n '2p' "$pick")"
            echo "Creating simulators as $DEVTYPE / $RUNTIME"
          fi
          rm -f "$pick"

          for attempt in 1 2 3; do
            killall -9 xcodebuild || true
            killall -9 maestro-driver-iosUITests-Runner || true

            out="e2e-ios-out-attempt-${attempt}"
            rm -rf "$out"
            mkdir -p "$out"
            echo "$attempt" > "$out/attempt"

            status=0
            reason=""
            udid=""

            if [ -z "$DEVTYPE" ] || [ -z "$RUNTIME" ]; then
              status=1
              reason="could not pick an iPhone device type and iOS runtime"
            else
              udid="$(run_with_timeout 30 xcrun simctl create "e2e-attempt-${attempt}-${GITHUB_RUN_ID:-$$}" "$DEVTYPE" "$RUNTIME")" || status=$?
              udid="$(printf '%s' "$udid" | tr -d '[:space:]')"
              if [ "$status" -ne 0 ] || [ -z "$udid" ]; then
                [ "$status" -eq 0 ] && status=1
                if [ "$status" -eq 124 ]; then
                  reason="simctl create timed out after 30s"
                else
                  reason="simctl create failed (status $status)"
                fi
                udid=""
              fi
            fi

            if [ "$status" -eq 0 ]; then
              echo "$udid" > "$out/udid"
              echo "Simulator: $udid"
              summary="$(mktemp)"
              GITHUB_STEP_SUMMARY="$summary" SIM_UDID="$udid" run_with_timeout "$ATTEMPT_TIMEOUT" \
                iosApp/maestro/run-e2e.sh app/Blueberry.app "$out" || status=$?
              if [ "$status" -eq 0 ]; then
                reason="success"
              else
                run_with_timeout 10 xcrun simctl list devices > "$out/simctl-list.txt" 2>&1 || true
                if [ "$status" -eq 124 ]; then
                  reason="attempt timed out after ${ATTEMPT_TIMEOUT}s"
                elif [ "$status" -eq 125 ]; then
                  reason="simctl bootstatus timed out after 180s"
                elif [ "$status" -eq 126 ]; then
                  reason="simctl command timed out"
                else
                  reason="failed (status $status)"
                fi
              fi
            fi

            echo "$status" > "$out/status"
            echo "$reason" > "$out/reason"
            echo "e2e attempt $attempt $reason"

            delete_sim "$udid"

            rm -rf e2e-ios-out
            mv "$out" e2e-ios-out

            if [ "$status" -eq 0 ]; then
              publish_summary
              exit 0
            fi
          done
          publish_summary
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ios
          path: e2e-ios-out
          if-no-files-found: warn
          retention-days: 14
