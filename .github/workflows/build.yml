name: Build

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Assemble debug APK
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          archive: false

  desktop:
    name: desktop-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            gradle: :desktopApp:packageDeb
            artifact-name: desktop-linux
            artifact-path: desktopApp/build/compose/binaries/main/deb/*.deb
          - name: macos
            os: macos-latest
            gradle: :desktopApp:packageDmg
            artifact-name: desktop-macos
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          - name: windows
            os: windows-latest
            gradle: :desktopApp:packageMsi
            artifact-name: desktop-windows
            artifact-path: desktopApp/build/compose/binaries/main/msi/*.msi
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Install fakeroot
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Add WiX to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin",
            "${env:ProgramFiles}\WiX Toolset v3.14\bin"
          )
          $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset --yes --no-progress
            $wixBin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $wixBin) { throw "WiX bin not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Write-Host "Using WiX at $wixBin"

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew ${{ matrix.gradle }} --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

  ios:
    name: ios-simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Build iOS simulator app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Check simulator app
        run: test -d iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/Blueberry.app

      # Tarred so the app keeps its executable bits; the e2e-ios-simulator job below reuses it.
      - name: Package simulator app
        run: tar -czf Blueberry-ios-simulator.tar.gz -C iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator Blueberry.app

      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: Blueberry-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 14

  e2e-ios-simulator:
    name: e2e-ios-simulator
    needs: ios
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        with:
          name: ios-simulator

      - name: Unpack simulator app
        run: |
          mkdir -p app
          tar -xzf Blueberry-ios-simulator.tar.gz -C app
          test -x app/Blueberry.app/Blueberry

      - name: Install Maestro (pinned, checksum verified)
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      # Runs every flow in iosApp/maestro/flows (see iosApp/maestro/README.md). Test Tor flows use the
      # live Tor network, no mocks.
      - name: Run Maestro flows on an iPhone simulator
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
        run: |
          # 35-minute cap per attempt; 120-minute job limit fits three plus setup.
          ATTEMPT_TIMEOUT=2100
          SHUTDOWN_WAIT=60
          JOB_SUMMARY="${GITHUB_STEP_SUMMARY:-}"

          # macOS-safe timeout: no GNU timeout. Kills the process group on expiry (exit 124).
          run_with_timeout() {
            local seconds=$1
            shift
            perl -e '
              my $timeout = shift @ARGV;
              my $pid = fork();
              die "fork: $!" unless defined $pid;
              if ($pid == 0) {
                setpgrp(0, 0);
                exec @ARGV;
                exit 127;
              }
              $SIG{ALRM} = sub {
                kill "TERM", -$pid;
                sleep 2;
                kill "KILL", -$pid;
                waitpid($pid, 0);
                exit 124;
              };
              alarm $timeout;
              waitpid($pid, 0);
              my $status = $?;
              alarm 0;
              exit($status == -1 ? 1 : ($status & 127) ? 1 : ($status >> 8));
            ' "$seconds" "$@"
          }

          wait_for_shutdown() {
            local i
            for i in $(seq 1 "$SHUTDOWN_WAIT"); do
              if xcrun simctl list devices -j | python3 -c 'import json,sys; busy={"Booted","Shutting Down","Booting"}; sys.exit(any(d.get("state") in busy for ds in json.load(sys.stdin).get("devices",{}).values() for d in ds))'; then
                return 0
              fi
              sleep 1
            done
            echo "warning: simulators still not Shutdown after ${SHUTDOWN_WAIT}s"
          }

          publish_summary() {
            if [ -n "$JOB_SUMMARY" ] && [ -f e2e-ios-out/summary.md ]; then
              cat e2e-ios-out/summary.md >> "$JOB_SUMMARY"
            fi
          }

          for attempt in 1 2 3; do
            killall -9 xcodebuild || true
            killall -9 maestro-driver-iosUITests-Runner || true
            xcrun simctl shutdown all || true
            wait_for_shutdown

            out="e2e-ios-out-attempt-${attempt}"
            rm -rf "$out"
            summary="$(mktemp)"
            status=0
            GITHUB_STEP_SUMMARY="$summary" run_with_timeout "$ATTEMPT_TIMEOUT" \
              iosApp/maestro/run-e2e.sh app/Blueberry.app "$out" || status=$?

            if [ -f "$out/summary.md" ] || [ -f "$out/report.xml" ] || [ -d "$out/maestro" ]; then
              rm -rf e2e-ios-out
              mv "$out" e2e-ios-out
            fi

            if [ "$status" -eq 0 ]; then
              publish_summary
              exit 0
            fi
            if [ "$status" -eq 124 ]; then
              echo "e2e attempt $attempt timed out after ${ATTEMPT_TIMEOUT}s"
            else
              echo "e2e attempt $attempt failed (status $status)"
            fi
          done
          publish_summary
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ios
          path: e2e-ios-out
          if-no-files-found: warn
          retention-days: 14
