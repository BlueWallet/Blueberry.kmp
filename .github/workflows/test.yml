name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jvm
            os: ubuntu-latest
            gradle: :storage:jvmTest :wallet:jvmTest :shared:jvmTest
          - name: androidHost
            os: ubuntu-latest
            gradle: :wallet:testAndroidHostTest :shared:testAndroidHostTest
          - name: iosSimulator
            os: macos-latest
            gradle: :storage:iosSimulatorArm64Test :wallet:iosSimulatorArm64Test :shared:iosSimulatorArm64Test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Run ${{ matrix.name }} tests
        run: ./gradlew ${{ matrix.gradle }} --no-daemon
