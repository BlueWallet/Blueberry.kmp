name: CI scripts

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/testflight.yml"
      - ".github/workflows/ci-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight-scripts:
    name: testflight-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Test TestFlight notes scripts
        run: python3 -B -W error::ResourceWarning .github/scripts/test_testflight_scripts.py
