name: TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: ios-testflight
    runs-on: macos-latest
    timeout-minutes: 180
    # Only the upload is serialized, so a slow notes wait does not hold up the next upload.
    concurrency:
      group: testflight-ios
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.versions.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Compute versions
        id: versions
        run: |
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          echo "MARKETING_VERSION=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Import App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Import signing certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/blueberry.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 --decode > "${RUNNER_TEMP}/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "${RUNNER_TEMP}/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "${RUNNER_TEMP}/dist.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APPSTORE_PROFILE" | base64 --decode > "${RUNNER_TEMP}/profile.mobileprovision"
          UUID="$(security cms -D -i "${RUNNER_TEMP}/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "${RUNNER_TEMP}/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile $UUID"
          rm -f "${RUNNER_TEMP}/profile.mobileprovision"

      - name: Archive iOS app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/Blueberry.xcarchive \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            PRODUCT_BUNDLE_IDENTIFIER=io.bluewallet.blueberry \
            DEVELOPMENT_TEAM=A7W54YZ4WU \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Blueberry App Store" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath iosApp/build/Blueberry.xcarchive \
            -exportPath iosApp/build/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight
          path: iosApp/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          archive: false

      # The BlueWallet team internal group has access to every build, so this job
      # does not assign builds. Apple publishes the build to that group after processing.
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(ls iosApp/build/export/*.ipa)"
          LOG="${RUNNER_TEMP}/altool.log"
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$LOG"
          UUID="$(sed -n 's/.*Delivery UUID:[[:space:]]*//p' "$LOG" | tr -d '\r' | head -n 1)"
          test -n "$UUID"
          echo "Uploaded $UUID"

  # Runs on Linux after a successful upload, so waiting for Apple to list the
  # build (5 to 30+ minutes) costs no macOS time and does not block the next
  # upload. The build is already on TestFlight either way. If Apple is just slow
  # to list it, the job only warns; any other failure (key role, rejected notes)
  # fails this job so it is noticed.
  testflight-notes:
    name: testflight-notes
    needs: ios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history, so commits of an older merged branch are not cut off.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Only git log runs here; nothing needs the token afterwards.
          persist-credentials: false

      - name: Set TestFlight What to Test
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: io.bluewallet.blueberry
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          export ASC_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          (umask 077 && printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$ASC_KEY_PATH")
          chmod 600 "$ASC_KEY_PATH"
          unset APP_STORE_CONNECT_API_KEY
          export NOTES_FILE="${RUNNER_TEMP}/what-to-test.txt"
          NOTES_ERR="${RUNNER_TEMP}/what-to-test.err"
          notes_rc=0
          .github/scripts/testflight_notes.sh "$BEFORE_SHA" "$GITHUB_SHA" \
            > "$NOTES_FILE" 2> "$NOTES_ERR" || notes_rc=$?
          if [ "$notes_rc" -ne 0 ]; then
            echo "::warning::testflight_notes.sh failed (exit ${notes_rc}), so What to Test lists only the commit sha. Its error is printed below."
            echo "Build commit ${GITHUB_SHA::7}" > "$NOTES_FILE"
          fi
          # Commit subjects, and errors that may echo them, must not be
          # parsed as workflow commands.
          STOP_TOKEN="$(openssl rand -hex 16)"
          echo "::stop-commands::${STOP_TOKEN}"
          cat "$NOTES_ERR"
          cat "$NOTES_FILE"
          rc=0
          python3 .github/scripts/testflight_what_to_test.py || rc=$?
          echo "::${STOP_TOKEN}::"
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Build ${BUILD_NUMBER} was not listed by App Store Connect in time, so What to Test was not set. The upload itself succeeded."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::Could not set TestFlight What to Test for build ${BUILD_NUMBER}. The upload itself succeeded."
            exit "$rc"
          fi
