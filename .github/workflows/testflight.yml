name: TestFlight

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: testflight-ios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: ios-testflight
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Compute versions
        run: |
          echo "MARKETING_VERSION=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Import App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Import signing certificate
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/blueberry.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$IOS_DIST_P12" | base64 --decode > "${RUNNER_TEMP}/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "${RUNNER_TEMP}/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "${RUNNER_TEMP}/dist.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install provisioning profile
        env:
          IOS_APPSTORE_PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APPSTORE_PROFILE" | base64 --decode > "${RUNNER_TEMP}/profile.mobileprovision"
          UUID="$(security cms -D -i "${RUNNER_TEMP}/profile.mobileprovision" | plutil -extract UUID raw -)"
          cp "${RUNNER_TEMP}/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          echo "Installed profile $UUID"
          rm -f "${RUNNER_TEMP}/profile.mobileprovision"

      - name: Archive iOS app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/Blueberry.xcarchive \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            PRODUCT_BUNDLE_IDENTIFIER=io.bluewallet.blueberry \
            DEVELOPMENT_TEAM=A7W54YZ4WU \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Blueberry App Store" \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath iosApp/build/Blueberry.xcarchive \
            -exportPath iosApp/build/export \
            -exportOptionsPlist iosApp/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight
          path: iosApp/build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload to TestFlight
        id: upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(ls iosApp/build/export/*.ipa)"
          LOG="${RUNNER_TEMP}/altool.log"
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$LOG"
          UUID="$(sed -n 's/.*Delivery UUID:[[:space:]]*//p' "$LOG" | tr -d '\r' | head -n 1)"
          test -n "$UUID"
          echo "delivery_uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "Uploaded $UUID"

      - name: Assign build to internal testers
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TESTFLIGHT_BUILD_ID: ${{ steps.upload.outputs.delivery_uuid }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/tf"
          "${RUNNER_TEMP}/tf/bin/pip" install PyJWT cryptography
          "${RUNNER_TEMP}/tf/bin/python" <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          import jwt

          ASC = "https://api.appstoreconnect.apple.com"
          RETRY = {404, 429, 500, 502, 503, 504}
          build_id = os.environ["TESTFLIGHT_BUILD_ID"]
          pem = os.environ["APP_STORE_CONNECT_API_KEY"]
          if not pem.endswith("\n"):
              pem += "\n"

          def token():
              now = int(time.time())
              raw = jwt.encode(
                  {"iss": os.environ["APP_STORE_CONNECT_ISSUER_ID"], "iat": now, "exp": now + 15 * 60, "aud": "appstoreconnect-v1"},
                  pem,
                  algorithm="ES256",
                  headers={"kid": os.environ["APP_STORE_CONNECT_KEY_ID"], "typ": "JWT"},
              )
              return raw.decode() if isinstance(raw, bytes) else raw

          def decode(raw):
              if not raw:
                  return {}
              try:
                  return json.loads(raw)
              except ValueError:
                  return {"raw": raw.decode("utf-8", "replace")}

          def call(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  ASC + path,
                  data=data,
                  method=method,
                  headers={"Authorization": "Bearer " + token(), "Accept": "application/json", "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      return resp.status, decode(resp.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, decode(exc.read())
              except urllib.error.URLError as exc:
                  return 503, {"raw": str(exc.reason)}

          state = "PROCESSING"
          for _ in range(120):
              status, payload = call("GET", "/v1/builds/" + build_id)
              if status == 200:
                  state = payload["data"]["attributes"]["processingState"]
                  print("processingState=" + state)
                  if state == "VALID":
                      break
                  if state in {"INVALID", "FAILED"}:
                      raise SystemExit("build processing failed: " + state)
              elif status in RETRY:
                  print("build not visible yet HTTP " + str(status))
              else:
                  raise SystemExit("GET build HTTP " + str(status) + " " + str(payload))
              time.sleep(30)
          else:
              raise SystemExit("build still " + state)

          def until_ok(path, label):
              last = {}
              for _ in range(10):
                  status, payload = call("GET", path)
                  if status == 200:
                      return payload
                  if status not in RETRY:
                      raise SystemExit(label + " HTTP " + str(status) + " " + str(payload))
                  last = payload
                  time.sleep(30)
              raise SystemExit(label + " still failing " + str(last))

          apps = until_ok("/v1/apps?" + urllib.parse.urlencode({"filter[bundleId]": "io.bluewallet.blueberry"}), "app")
          if not apps.get("data"):
              raise SystemExit("app not found " + str(apps))
          app_id = apps["data"][0]["id"]
          groups = until_ok("/v1/betaGroups?" + urllib.parse.urlencode({"filter[app]": app_id, "filter[isInternalGroup]": "true"}), "groups")
          targets = [
              g for g in groups.get("data") or []
              if g.get("attributes", {}).get("isInternalGroup") and not g.get("attributes", {}).get("hasAccessToAllBuilds")
          ]
          if not targets:
              raise SystemExit("no assignable internal groups")
          assigned = 0
          for group in targets:
              name = group["attributes"]["name"]
              path = "/v1/betaGroups/" + group["id"] + "/relationships/builds"
              body = {"data": [{"type": "builds", "id": build_id}]}
              for attempt in range(10):
                  status, payload = call("POST", path, body)
                  if status in {200, 201, 204, 409}:
                      print("assigned to " + name + " HTTP " + str(status))
                      assigned += 1
                      break
                  if status not in RETRY and status != 422:
                      raise SystemExit("assign " + name + " HTTP " + str(status) + " " + str(payload))
                  print("assign " + name + " HTTP " + str(status) + " attempt " + str(attempt + 1))
                  time.sleep(30)
              else:
                  raise SystemExit("assign " + name + " failed")
          if assigned == 0:
              raise SystemExit("assigned to no internal groups")
          PY
