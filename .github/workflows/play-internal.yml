name: Play internal

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: play-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: android-play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Compute versions
        run: |
          echo "VERSION_NAME=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(date -u +%Y%m%d%H)" >> "$GITHUB_ENV"

      - name: Bundle release
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: ./gradlew :androidApp:bundleRelease --no-daemon -PversionCode="${VERSION_CODE}" -PversionName="${VERSION_NAME}"

      - name: Sign app bundle
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "${RUNNER_TEMP}/blueberry-upload.jks"
          AAB="$(echo androidApp/build/outputs/bundle/release/*.aab)"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "${RUNNER_TEMP}/blueberry-upload.jks" \
            -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
            "$AAB" \
            blueberry-upload
          jarsigner -verify "$AAB"
          rm -f "${RUNNER_TEMP}/blueberry-upload.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-play-internal
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
          archive: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Internal testers are managed in Play Console. This job does not add them
      # and does not promote the release to production.
      - name: Upload to Play internal testing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "${RUNNER_TEMP}/play-venv"
          "${RUNNER_TEMP}/play-venv/bin/pip" install --disable-pip-version-check 'google-auth==2.40.3'
          printf '%s\n' "$PLAY_SERVICE_ACCOUNT_JSON" > "${RUNNER_TEMP}/play-service-account.json"
          chmod 600 "${RUNNER_TEMP}/play-service-account.json"
          AAB="$(echo androidApp/build/outputs/bundle/release/*.aab)"
          "${RUNNER_TEMP}/play-venv/bin/python" .github/scripts/upload_play_internal.py \
            --aab "$AAB" \
            --service-account "${RUNNER_TEMP}/play-service-account.json" \
            --version-name "${VERSION_NAME}"
          rm -f "${RUNNER_TEMP}/play-service-account.json"
