# DEBUG ONLY: iOS back-navigation flicker investigation. Not for merge.
name: Debug iOS back flicker

on:
  push:
    branches: [debug/ios-back-flicker]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flicker:
    name: flicker-ios${{ matrix.ios }}
    strategy:
      fail-fast: false
      matrix:
        ios: ["26", "18"]
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0"

      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}

      - name: Build iOS simulator app
        env:
          ROCKETX_API_KEY: ${{ secrets.ROCKETX_API_KEY }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build
          mkdir -p app
          cp -R iosApp/build/DerivedData/Build/Products/Debug-iphonesimulator/Blueberry.app app/

      - name: Install Maestro (pinned, checksum verified)
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Record back transitions
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
        run: iosApp/maestro/debug-flicker-run.sh app/Blueberry.app flicker-out "${{ matrix.ios }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flicker-ios${{ matrix.ios }}
          path: flicker-out
          if-no-files-found: warn
          retention-days: 7
