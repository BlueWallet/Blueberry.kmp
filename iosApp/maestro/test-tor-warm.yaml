# Second "Test Tor" tap on the already-open Settings screen (warm circuit).
appId: io.bluewallet.blueberry
---
- extendedWaitUntil:
    visible: "Test Tor"
    timeout: 30000
- tapOn: "Test Tor"
- extendedWaitUntil:
    notVisible: "Testing Tor…"
    timeout: 200000
- extendedWaitUntil:
    visible: "OK"
    timeout: 10000
- takeScreenshot: 07-test-tor-warm-ok
